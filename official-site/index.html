<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SaotieSNS 官网，了解社区玩法、功能说明和最新动态。">
  <meta name="keywords" content="SaotieSNS,社区,论坛,轻社交">
  <link rel="canonical" href="https://www.saotie.com/">
  <title>SaotieSNS · 轻社交社区</title>
  <style>
    :root { color-scheme: light; --bg:#e8ebf0; --surface:#e8ebf0; --text:#30394b; --muted:#697286; --faint:#7d8797; --primary:#4a6fc4; --primary-dark:#36569e; --success:#2f9b6b; --shadow-sm:-3px -3px 7px rgba(255,255,255,.82),3px 3px 7px rgba(163,177,198,.48); --shadow-md:-8px -8px 18px rgba(255,255,255,.86),8px 8px 18px rgba(163,177,198,.52); --shadow-lg:-14px -14px 30px rgba(255,255,255,.88),14px 14px 30px rgba(163,177,198,.58); --inset:inset 4px 4px 9px rgba(163,177,198,.48),inset -4px -4px 9px rgba(255,255,255,.82); --radius-sm:12px; --radius-md:20px; --radius-lg:30px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; line-height:1.6; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(1160px,calc(100% - 40px)); margin:0 auto; }
    .site-nav { position:sticky; top:0; z-index:10; padding:18px 0; background:rgba(232,235,240,.88); backdrop-filter:blur(14px); }
    .nav-in { display:flex; align-items:center; justify-content:space-between; gap:22px; }
    .brand { display:inline-flex; align-items:center; gap:12px; min-width:0; font-weight:800; font-size:20px; letter-spacing:-.02em; }
    .logo { width:42px; height:42px; display:grid; place-items:center; flex:none; overflow:hidden; border-radius:14px; background:var(--bg); box-shadow:var(--shadow-sm); color:var(--primary); font-size:19px; font-weight:800; }
    .logo img { width:100%; height:100%; object-fit:cover; }
    .nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .nav-links a { min-height:42px; display:inline-flex; align-items:center; padding:0 15px; border-radius:999px; color:var(--muted); font-size:14px; font-weight:600; }
    .nav-links a:hover, .nav-links a.active { color:var(--primary-dark); box-shadow:var(--inset); }
    .btn { min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 20px; border:0; border-radius:999px; background:var(--primary); color:#fff; box-shadow:var(--shadow-sm); font-weight:700; transition:transform .2s ease,box-shadow .2s ease,background .2s ease; }
    .btn:hover { background:var(--primary-dark); transform:translateY(-1px); box-shadow:var(--shadow-md); }
    .btn:active { transform:translateY(1px); box-shadow:var(--inset); }
    .btn-soft { color:var(--text); background:var(--bg); }
    .hero { padding:38px 0 28px; }
    .hero-card { display:grid; grid-template-columns:minmax(0,1.04fr) minmax(360px,.96fr); gap:34px; align-items:center; padding:clamp(28px,5vw,64px); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow-lg); }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; color:var(--primary); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .eyebrow::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:var(--shadow-sm); }
    h1 { margin:16px 0 14px; max-width:620px; font-size:clamp(40px,6.5vw,72px); line-height:1.04; letter-spacing:-.045em; }
    .lead { max-width:590px; margin:0; color:var(--muted); font-size:clamp(16px,2vw,20px); line-height:1.75; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:34px; max-width:600px; }
    .stat { min-height:92px; padding:16px; border-radius:var(--radius-md); box-shadow:var(--inset); }
    .stat b { display:block; font-size:28px; line-height:1.1; letter-spacing:-.02em; }
    .stat span { display:block; margin-top:7px; color:var(--muted); font-size:13px; }
    .hero-visual { min-height:360px; display:grid; place-items:center; padding:28px; border-radius:var(--radius-lg); box-shadow:var(--inset); }
    .visual-panel { width:min(100%,390px); padding:24px; border-radius:var(--radius-md); box-shadow:var(--shadow-md); }
    .visual-top,.visual-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .visual-top { color:var(--muted); font-size:13px; font-weight:700; }
    .visual-mark { width:86px; height:86px; display:grid; place-items:center; margin:36px auto 26px; border-radius:28px; color:var(--primary); box-shadow:var(--shadow-md); font-size:40px; font-weight:800; }
    .visual-title { text-align:center; font-size:22px; font-weight:800; }
    .visual-sub { margin-top:5px; text-align:center; color:var(--muted); font-size:13px; }
    .visual-row { margin-top:26px; padding-top:17px; border-top:1px solid rgba(120,132,151,.2); color:var(--muted); font-size:13px; }
    .visual-row strong { color:var(--success); }
    .main { display:grid; grid-template-columns:minmax(0,1fr) 316px; gap:22px; align-items:start; padding:14px 0 58px; }
    .card { border-radius:var(--radius-md); background:var(--surface); box-shadow:var(--shadow-md); }
    .content { min-width:0; padding:clamp(24px,4vw,42px); }
    .content h1 { max-width:none; margin:0 0 18px; font-size:clamp(30px,4vw,46px); }
    .content h2 { margin:34px 0 12px; font-size:24px; letter-spacing:-.02em; }
    .content h3 { margin:26px 0 10px; font-size:18px; }
    .content p,.content li { color:var(--muted); font-size:16px; line-height:1.9; }
    .content ul { margin:10px 0 20px; padding-left:22px; }
    .content a { color:var(--primary-dark); text-decoration:underline; text-decoration-color:rgba(74,111,196,.35); text-underline-offset:3px; }
    .md-image { margin:26px 0; overflow:hidden; border-radius:var(--radius-md); box-shadow:var(--inset); }
    .md-image img { display:block; width:100%; height:auto; max-height:460px; object-fit:cover; border-radius:var(--radius-md); }
    .md-image figcaption { padding:12px 15px; color:var(--muted); font-size:13px; }
    .sidebar { display:grid; gap:18px; }
    .side { padding:22px; }
    .side h3 { margin:0 0 16px; font-size:16px; }
    .topic-list,.user-list,.page-list { display:grid; gap:12px; }
    .topic,.page-card { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 15px; border-radius:var(--radius-sm); box-shadow:var(--inset); color:var(--text); }
    .topic:hover,.page-card:hover { color:var(--primary-dark); }
    .topic span,.page-card span { color:var(--muted); font-size:12px; white-space:nowrap; }
    .page-card { display:block; }
    .page-card b { display:block; margin-bottom:3px; }
    .page-card span { display:block; white-space:normal; line-height:1.5; }
    .user { display:flex; align-items:center; gap:11px; min-width:0; padding:4px 0; }
    .user:hover b { color:var(--primary-dark); }
    .avatar { width:38px; height:38px; display:grid; place-items:center; flex:none; overflow:hidden; border-radius:13px; color:var(--primary); box-shadow:var(--shadow-sm); font-weight:800; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .user b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .user small { color:var(--muted); }
    .foot { padding:24px 0 36px; color:var(--faint); font-size:13px; text-align:center; }
    .loading { min-height:320px; display:grid; place-items:center; color:var(--muted); }
    .error { padding:16px; border-radius:var(--radius-sm); color:#7c1d1d; background:#f3dede; box-shadow:var(--inset); }
    @media (max-width:900px) { .hero-card { grid-template-columns:1fr; } .hero-visual { min-height:290px; } .main { grid-template-columns:1fr; } .sidebar { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:640px) { .wrap { width:min(100% - 28px,560px); } .site-nav { padding:12px 0; } .nav-in { align-items:flex-start; flex-direction:column; gap:12px; } .nav-links { width:100%; justify-content:flex-start; overflow-x:auto; flex-wrap:nowrap; padding:3px 2px 7px; } .nav-links a { flex:0 0 auto; min-height:40px; padding:0 12px; } .hero { padding-top:24px; } .hero-card { gap:24px; padding:26px 20px; border-radius:24px; } h1 { font-size:clamp(38px,13vw,56px); } .lead { font-size:16px; } .stats { gap:10px; margin-top:24px; } .stat { min-height:78px; padding:12px; } .stat b { font-size:23px; } .stat span { font-size:12px; } .hero-visual { min-height:250px; padding:20px; } .visual-mark { width:70px; height:70px; margin:24px auto 20px; font-size:32px; } .main { padding-top:4px; } .content { padding:24px 20px; } .content p,.content li { font-size:15px; } .sidebar { grid-template-columns:1fr; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <header class="site-nav"><div class="wrap nav-in"><a class="brand" href="/"><span class="logo" id="brandLogo">S</span><span id="brandName">SaotieSNS</span></a><nav class="nav-links" id="pageNav"><a href="/" class="active">首页</a><a href="https://saotie.com" class="btn">进入社区</a></nav></div></header>
  <section class="wrap hero"><div class="hero-card"><div class="hero-copy"><div class="eyebrow">Saotie Official Site</div><h1 id="heroTitle">SaotieSNS</h1><p class="lead" id="heroLead">轻社交、轻论坛、轻社区。</p><div class="hero-actions"><a class="btn" href="https://saotie.com">进入社区</a><a class="btn btn-soft" href="https://github.com/xmyuntule/Saotie" target="_blank" rel="noreferrer">开源仓库</a></div><div class="stats"><div class="stat"><b id="statUsers">-</b><span>注册用户</span></div><div class="stat"><b id="statPosts">-</b><span>社区动态</span></div><div class="stat"><b id="statTopics">-</b><span>热门话题</span></div></div></div><div class="hero-visual"><div class="visual-panel"><div class="visual-top"><span>SAOTIE / COMMUNITY</span><span>● 在线</span></div><div class="visual-mark" id="visualMark">S</div><div class="visual-title">有趣的人，值得分享的内容</div><div class="visual-sub">在柔和的社区空间里发现新连接</div><div class="visual-row"><span>轻社交 · 轻论坛 · 轻社区</span><strong>开放加入</strong></div></div></div></div></section>
  <main class="wrap main"><article class="card content" id="content"><div class="loading">正在加载页面内容...</div></article><aside class="sidebar"><section class="card side"><h3>官网页面</h3><div class="page-list" id="pageList"></div></section><section class="card side"><h3>热门话题</h3><div class="topic-list" id="hotTopics"></div></section><section class="card side"><h3>最新用户</h3><div class="user-list" id="latestUsers"></div></section></aside></main>
  <footer class="foot"><div class="wrap" id="footerText">© 2026 SaotieSNS</div></footer>
  <script>
    const API='https://saotie.com/api', MAIN='https://saotie.com', slug=(location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0]||'home').toLowerCase();
    function escapeHtml(text){return String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
    function inline(text){return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');}
    function markdown(md){const lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html=[];let list=false;const close=()=>{if(list){html.push('</ul>');list=false;}};const localAsset=(url)=>/^https?:\/\//i.test(String(url||''))?url:new URL(String(url||'/'),location.origin).href;for(const raw of lines){const line=raw.trim();if(!line){close();continue;}const image=line.match(/^!\[([^\]]*)\]\((https?:\/\/[^)]+|\/[^)]+)\)$/);if(image){close();const alt=escapeHtml(image[1]);html.push(`<figure class="md-image"><img src="${escapeHtml(localAsset(image[2]))}" alt="${alt}" loading="lazy" decoding="async"><figcaption>${alt}</figcaption></figure>`);continue;}if(line.startsWith('### ')){close();html.push('<h3>'+inline(line.slice(4))+'</h3>');continue;}if(line.startsWith('## ')){close();html.push('<h2>'+inline(line.slice(3))+'</h2>');continue;}if(line.startsWith('# ')){close();html.push('<h1>'+inline(line.slice(2))+'</h1>');continue;}if(line.startsWith('- ')){if(!list){html.push('<ul>');list=true;}html.push('<li>'+inline(line.slice(2))+'</li>');continue;}close();html.push('<p>'+inline(line)+'</p>');}close();return html.join('');}
    function abs(url){const value=String(url||'').trim();if(!value)return '';if(/^https?:\/\//i.test(value))return value;return value.startsWith('/')?MAIN+value:value;}
    function fmt(n){const value=Number(n||0);return value>=10000?(value/10000).toFixed(1).replace(/\.0$/,'')+'万':value.toLocaleString('zh-CN');}
    function setMeta(name,content){if(!content)return;let tag=document.querySelector(`meta[name="${name}"]`);if(!tag){tag=document.createElement('meta');tag.name=name;document.head.appendChild(tag);}tag.content=content;}
    function setCanonical(url){let tag=document.querySelector('link[rel="canonical"]');if(!tag){tag=document.createElement('link');tag.rel='canonical';document.head.appendChild(tag);}tag.href=url;}
    async function getJSON(path){const res=await fetch(API+path,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('request failed');return res.json();}
    function renderNav(pages,currentSlug){const nav=document.getElementById('pageNav');nav.innerHTML=pages.map(page=>{const href=page.slug==='home'?'/':'/'+page.slug;return `<a class="${page.slug===currentSlug?'active':''}" href="${href}">${escapeHtml(page.title)}</a>`;}).join('')+'<a href="https://saotie.com" class="btn">进入社区</a>';document.getElementById('pageList').innerHTML=pages.map(page=>{const href=page.slug==='home'?'/':'/'+page.slug;return `<a class="page-card" href="${href}"><b>${escapeHtml(page.title)}</b><span>${escapeHtml(page.seoDescription||page.title)}</span></a>`;}).join('');}
    function renderWidgets(widgets){const stats=widgets.stats||{};document.getElementById('statUsers').textContent=fmt(stats.users);document.getElementById('statPosts').textContent=fmt(stats.posts);document.getElementById('statTopics').textContent=fmt(stats.topics);document.getElementById('hotTopics').innerHTML=(widgets.hotTopics||[]).map(topic=>`<a class="topic" href="${MAIN}/topic/${encodeURIComponent(topic.name)}"><b>#${escapeHtml(topic.name)}</b><span>${fmt(topic.postCount)} 动态</span></a>`).join('')||'<div class="topic"><b>暂无话题</b><span>稍后再看</span></div>';document.getElementById('latestUsers').innerHTML=(widgets.latestUsers||[]).map(user=>{const avatar=abs(user.avatar),initial=escapeHtml((user.nickname||user.username||'S').slice(0,1).toUpperCase());return `<a class="user" href="${MAIN}/u/${encodeURIComponent(user.username)}"><span class="avatar">${avatar?`<img src="${avatar}" alt="">`:initial}</span><span><b>${escapeHtml(user.nickname||user.username)}</b><small>@${escapeHtml(user.username)}</small></span></a>`;}).join('')||'<div class="user"><span class="avatar">S</span><span><b>暂无用户</b><small>欢迎注册</small></span></div>';}
    function renderSite(site){const name=site.name||'SaotieSNS';document.getElementById('brandName').textContent=name;const logo=abs(site.logo);document.getElementById('brandLogo').innerHTML=logo?`<img src="${logo}" alt="">`:escapeHtml(name.slice(0,1).toUpperCase());document.getElementById('visualMark').textContent=name.slice(0,1).toUpperCase();document.getElementById('footerText').textContent=(site.copyright||`© 2026 ${name} · ${site.slogan||'轻社交社区'}`)+(site.icp?` · ${site.icp}`:'');}
    function renderPage(page,site){const title=page.seoTitle||page.title||site.name||'SaotieSNS';document.title=title.includes(site.name||'Saotie')?title:`${title} - ${site.name||'SaotieSNS'}`;setMeta('keywords',page.seoKeywords||'');setMeta('description',page.seoDescription||site.slogan||'');setCanonical(`https://www.saotie.com/${page.slug==='home'?'':page.slug}`);document.getElementById('heroTitle').textContent=page.title||site.name||'SaotieSNS';document.getElementById('heroLead').textContent=page.seoDescription||site.slogan||'轻社交、轻论坛、轻社区。';document.getElementById('content').innerHTML=markdown(page.content||'');}
    async function boot(){try{const data=await getJSON('/site/official/pages/'+encodeURIComponent(slug));renderSite(data.site||{});renderNav((data.pages&&data.pages.pages)||[],data.page.slug||slug);renderWidgets(data.widgets||{});renderPage(data.page||{},data.site||{});}catch(e){document.getElementById('content').innerHTML='<div class="error">页面加载失败，请稍后重试，或返回主社区继续浏览。</div>';}}boot();
  </script>
</body>
</html>
